services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-champions}
      POSTGRES_USER: ${POSTGRES_USER:-champions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champions_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    image: ${APP_IMAGE:-champions-predictor:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-champions}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-champions}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-champions_dev}
volumes:
  postgres_data:
