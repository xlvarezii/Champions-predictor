spring.application.name=champions-predictor
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/champions}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:champions}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:champions_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
